<style>

    .galeria{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        justify-content: center;
        gap: 25px;
        margin-top: 40px;
    }
    .galeria img{
        width: 250px;
        height: 180px;
        object-fit: cover;
        border-radius: 15px;
        border: 3px solid #F08686;
        box-shadow: 0 4px 10px #F08686;
        transition: all 0.3s ease;
    }
    .galeria img:hover {
        transform: scale(1.1);
        border-color: rgb(224, 114, 114);
        box-shadow: 0 10px 25px #F08686;
        cursor: pointer;
    }
